<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Food menu</title>
</head>
<body>
    <h1>Food Menu</h1> 
    <img src="restaurantmenumap.jpg" usemap="#FoodMenu" alt="Food Menu" width="400" height="400">
    <map name="FoodMenu">

        <area
           shape="rect"
           coords="995,1013,651,601"
           href="https://www.mydigimenu.com/"
           alt="Restaurant menu">'
        <area
           shape="circle"
           coords="258,365,185"
           href="https://lapinozpizza.in/"
           alt="Pizza">
        <area
           shape="circle"
           coords="711,385,162"
           href="https://www.burgerking.in/"
           alt="burger">
        <area
           shape="poly"
           coords="1028,434,1204,445,1124,310"
           href="https://theobroma.in/collections/cakes"
           alt="cake slice">
        <area
            shape="rect"
            coords="419,893,591,632"
            href="https://www.pepizofoods.com/"
            alt="French fries">
        <area
           shape="poly"
           coords="1199,626,1310,825,1032,781,1116,693""
           href="https://theobroma.in/collections/sandwiches-savouries"
           alt="Sandwich">
        <area
           shape="poly"
           coords="314,889,-1,866,54,562,337,668"
           href="https://potatorolls.com/"
           alt="potato rolls">


    </map>
</body>
</html>
