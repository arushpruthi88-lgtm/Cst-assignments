<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Map Explorer</title>
</head>
<body>

    <h1>World Map Explorer</h1>

    <img
        src="world_map.png"
        width="940"
        height="477"
        usemap="#worldmap">

    <map name="worldmap">

        <area shape="circle"
              coords="220,140,45"
              href="https://www.usa.gov/"
              alt="United States"
              target="_blank">

        <area shape="rect"
              coords="645,138,730,222"
              href="https://www.incredibleindia.gov.in/"
              alt="India"
              target="_blank">

        <area shape="poly"
              coords="449,84,466,84,475,96,469,108,456,108,449,98"
              href="https://www.visitbritain.com/"
              alt="United Kingdom"
              target="_blank">

        <area shape="default"
              href="https://www.un.org/en/about-us/member-states"
              alt="Other countries"
              target="_blank">
      

    </map>

</body>
</html>
