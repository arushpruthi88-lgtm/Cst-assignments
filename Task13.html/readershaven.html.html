<!DOCTYPE html>
<html>
<head>
  <title>Readers' Haven - Book Registration and Order Form</title>
</head>
<body>
  <h1>Readers' Haven</h1>
  <h2>Book Registration &amp; Order Form</h2>
  <p>Register your details and place a book order using this form.</p>

  <form action="#" target="_self">
    <h3>Customer Information</h3>

    <label for="customer-name">Customer Name:</label><br>
    <input type="text" id="customer-name" name="customer_name"
           placeholder="Enter your full name" required><br><br>

    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email"
           placeholder="name@example.com" required><br><br>

    <label for="mobile">Mobile Number:</label><br>
    <input type="tel" id="mobile" name="mobile"
           placeholder="Enter your mobile number" required><br><br>

    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age" min="1" max="120"><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required>

    <h3>Book Order Details</h3>

    <label for="category">Favorite Book Category:</label><br>
    <select id="category" name="category" required>
      <option value="">Select a category</option>
      <option value="fiction">Fiction</option>
      <option value="science">Science</option>
      <option value="history">History</option>
      <option value="children">Children's Books</option>
    </select><br><br>

    <label for="book-title">Book Title:</label><br>
    <input type="text" id="book-title" name="book_title"
           placeholder="Enter the book title" required><br><br>

    <label for="quantity">Quantity:</label><br>
    <input type="number" id="quantity" name="quantity"
           min="1" value="1" required><br><br>

    <label for="delivery-date">Delivery Date:</label><br>
    <input type="date" id="delivery-date" name="delivery_date" required><br><br>

    <label for="delivery-time">Preferred Delivery Time:</label><br>
    <input type="time" id="delivery-time" name="delivery_time">

    <h3>Preferred Payment Method</h3>

    <input type="radio" id="cod" name="payment_method"
           value="cash_on_delivery" required>
    <label for="cod">Cash on Delivery</label><br>

    <input type="radio" id="online" name="payment_method"
           value="online_payment">
    <label for="online">Online Payment</label>

    <h3>Additional Services</h3>

    <input type="checkbox" id="gift" name="services" value="gift_wrapping">
    <label for="gift">Gift Wrapping</label><br>

    <input type="checkbox" id="bookmark" name="services" value="bookmark">
    <label for="bookmark">Bookmark</label><br>

    <input type="checkbox" id="express" name="services" value="express_delivery">
    <label for="express">Express Delivery</label><br>

    <input type="checkbox" id="card" name="services" value="greeting_card">
    <label for="card">Greeting Card</label>

    <h3>Delivery Information</h3>

    <label for="address">Delivery Address:</label><br>
    <textarea id="address" name="address" rows="4" cols="40"
              placeholder="Enter your complete delivery address" required></textarea><br><br>

    <label for="instructions">Special Instructions:</label><br>
    <textarea id="instructions" name="special_instructions" rows="4" cols="40"
              placeholder="Add any delivery instructions"></textarea><br><br>

    <label for="upload">Upload a Reference Image or Document:</label><br>
    <input type="file" id="upload" name="reference_file"
           accept="image/*,.pdf,.doc,.docx">

    <input type="hidden" name="order_type"
           value="Readers Haven Book Order">

    <br><br>
    <button type="submit">Submit Order</button>
    <button type="reset">Reset Form</button>
  </form>
</body>
</html>
